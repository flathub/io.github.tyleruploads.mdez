app-id: io.github.tyleruploads.mdez
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: mdez
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
modules:
  - name: mdez
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://api.github.com/repos/tyleruploads/mdez/tarball/v0.16.0
        sha256: 206f540681b8a544a4282a6f0359d9f28d1f9400449881a9ab10969b96f394cb
        dest-filename: mdez.tar.gz
        x-checker-data:
          type: json
          url: https://api.github.com/repos/tyleruploads/mdez/releases/latest
          version-query: .tag_name
          url-query: .tarball_url
          is-main-source: true
